name: Validate Icons

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate-icons:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check app icons
              run: npm run validate:check
