name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Reject skipped tests
        run: |
          if grep -Eq '(^|[[:space:]])# SKIP|↓' test-output.log; then
            echo "::error::Tests were skipped; install the missing prerequisite or fix the test."
            grep -E '(^|[[:space:]])# SKIP|↓' test-output.log
            exit 1
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          overwrite: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: apps-obtainium:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke production image
        run: bash scripts/smoke-image.sh apps-obtainium:ci

  publish:
    name: publish
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: images
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${owner}/apps.obtainium.imranr.dev:latest"
            echo "ghcr.io/${owner}/apps.obtainium.imranr.dev:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.images.outputs.tags }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "no image digest" >&2; exit 1; }
          printf 'image digest: %s\n' "$DIGEST" | tee image-digest.txt
          printf '%s\n' "$TAGS" >> image-digest.txt
          {
            echo "## Published image"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ github.sha }}
          path: image-digest.txt
          if-no-files-found: error
          overwrite: true
